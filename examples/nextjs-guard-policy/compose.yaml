services:
  nextjs-guard-policy:
    build: .
    command: npm run dev
    labels:
      - dev.orbstack.domains=nextjs-guard-policy.arcjet-examples.orb.local
    env_file:
      - .env.local
    ports:
      - 3000
    volumes:
      - .:/app
      - nextjs-guard-policy_node_modules:/app/node_modules

volumes:
  nextjs-guard-policy_node_modules:
