services:
  nextjs-sensitive-info:
    build: .
    command: npm run dev
    labels:
      - dev.orbstack.domains=nextjs-sensitive-info.arcjet-examples.orb.local
    env_file:
      - .env.local
    ports:
      - 3000
    volumes:
      - .:/app
      - nextjs-sensitive-info_node_modules:/app/node_modules

volumes:
  nextjs-sensitive-info_node_modules:
