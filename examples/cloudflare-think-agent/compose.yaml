services:
  cloudflare-think-agent:
    build: .
    command: npm run dev
    env_file:
      - .env.local
    labels:
      - dev.orbstack.domains=cloudflare-think-agent.arcjet-examples.orb.local
    ports:
      - 3000
    volumes:
      - .:/app
      - cloudflare-think-agent_node_modules:/app/node_modules

volumes:
  cloudflare-think-agent_node_modules:
