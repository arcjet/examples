services:
  nextjs-ai-agent:
    build: .
    command: npm run dev
    labels:
      - dev.orbstack.domains=nextjs-ai-agent.arcjet-examples.orb.local
    env_file:
      - .env.local
    ports:
      - 3000
    volumes:
      - .:/app
      - nextjs_ai_agent_node_modules:/app/node_modules

volumes:
  nextjs_ai_agent_node_modules:
