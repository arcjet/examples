services:
  google-adk-agent:
    build: .
    command: npm run dev
    env_file:
      - .env.local
    labels:
      - dev.orbstack.domains=google-adk-agent.arcjet-examples.orb.local
    ports:
      - 3000
    volumes:
      - .:/app
      - google-adk-agent_node_modules:/app/node_modules

volumes:
  google-adk-agent_node_modules:
