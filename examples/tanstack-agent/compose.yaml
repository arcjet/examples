services:
  tanstack-agent:
    build: .
    command: npm run dev
    env_file:
      - .env.local
    labels:
      - dev.orbstack.domains=tanstack-agent.arcjet-examples.orb.local
    ports:
      - 3000
    volumes:
      - .:/app
      - tanstack-agent_node_modules:/app/node_modules

volumes:
  tanstack-agent_node_modules:
