services:
  strands-agent:
    build: .
    command: npm run dev
    env_file:
      - .env.local
    labels:
      - dev.orbstack.domains=strands-agent.arcjet-examples.orb.local
    ports:
      - 3000
    volumes:
      - .:/app
      - strands-agent_node_modules:/app/node_modules

volumes:
  strands-agent_node_modules:
